name: Deploy Static Frontend to cPanel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies (Monorepo Root)
        run: npm ci

      # --- 1. ADIM: NEXT.JS STATIC EXPORT BUILD (FRONTEND) ---
      - name: Build Next.js Frontend
        run: |
          cd apps/web
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      # --- 2. ADIM: BACKEND API BUILD ---
      - name: Build Backend API
        run: |
          cd apps/api
          npm run build

      # --- 3. ADIM: DEPLOY HAZIRLIĞI ---
      - name: Prepare Outputs for Server
        run: |
          mkdir -p deploy-ready/web
          mkdir -p deploy-ready/api

          # Statik export çıktısı artık 'out/' klasöründe; standalone'a gerek yok
          cp -r apps/web/out/* deploy-ready/web/

          # public/ içeriği (icon-192.png, icon-512.png vb.)
          cp -r apps/web/public/* deploy-ready/web/ 2>/dev/null || true

          # API derlenmiş çıktıları
          cp -r apps/api/dist deploy-ready/api/
          cp apps/api/package.json deploy-ready/api/
          cp apps/api/package-lock.json deploy-ready/api/ || true

      # --- 4. ADIM: FRONTEND'İ CPANEL'E FTP İLE GÖNDERME ---
      - name: Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-ready/web/
          server-dir: /deploy/web/

      # --- 5. ADIM: BACKEND'İ CPANEL'E FTP İLE GÖNDERME ---
      - name: Deploy Backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-ready/api/
          server-dir: /deploy/api/