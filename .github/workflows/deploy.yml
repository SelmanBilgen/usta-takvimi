name: Deploy Full Stack to cPanel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies (Monorepo Root)
        run: npm ci

      # --- 1. AD```yaml
      # --- 1. ADIM: NEXT.JS STATIC EXPORT BUILD (FRONTEND) ---
      - name: Build Next.js Frontend
        run: |
          cd apps/web
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      # --- 2. ADIM: BACKEND API BUILD ---
      - name: Build Backend API
        run: |
          cd apps/api
          npm run build

      # --- 3. ADIM: FRONTEND'İ CPANEL'E FTP İLE GÖNDERME ---
      - name: Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/out/
          server-dir: /deploy/web/

      # --- 4. ADIM: BACKEND'İ CPANEL'E FTP İLE GÖNDERME ---
      - name: Deploy Backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/api/dist/
          server-dir: /deploy/api/