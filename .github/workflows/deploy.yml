name: Deploy to Spaceship Hosting

on:
  push:
    branches:
      - main # Triggers deployment when you push to your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the code from GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Match your Spaceship Node version
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # 3. Build the static Next.js Web App
      - name: Build Next.js Web App
        run: |
          npm ci
          npm run build --workspace=@ustatakvimi/web
        env:
          NEXT_PUBLIC_API_URL: https://atinada.com/api/v1

      # 4. Upload the static site directly to the FTP document root
      - name: FTP Deploy to Spaceship Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/out/
          server-dir: /
