name: Deploy to cPanel (static web + Node API)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies (Monorepo Root)
        run: npm ci

      - name: Check required secrets
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for name in NEXT_PUBLIC_API_URL FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in GitHub: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi

      # 1. Frontend: Next.js static export -> apps/web/out
      - name: Build Next.js Frontend
        run: npm run build -w @ustatakvimi/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      # 2. Backend: single self-contained bundle -> apps/api/dist/server.cjs
      - name: Typecheck and Build Backend API
        run: |
          npm run typecheck -w @ustatakvimi/api
          npm run build -w @ustatakvimi/api

      # 3. Package both outputs
      - name: Prepare Outputs for Server
        run: |
          mkdir -p deploy-ready/web deploy-ready/api/tmp

          # "/." also copies dotfiles such as .htaccess
          cp -a apps/web/out/. deploy-ready/web/

          # The bundle has no runtime dependencies, so the manifest stays minimal
          cp apps/api/dist/server.cjs deploy-ready/api/server.cjs
          printf '{\n  "name": "usta-takvimi-api",\n  "version": "1.0.0",\n  "private": true,\n  "main": "server.cjs"\n}\n' > deploy-ready/api/package.json

          # Changing this file makes Passenger restart the Node app after each deploy
          echo "${GITHUB_SHA}" > deploy-ready/api/tmp/restart.txt

      # 4. Frontend -> the domain's document root (default: public_html)
      - name: Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-ready/web/
          server-dir: ${{ secrets.FTP_WEB_DIR || './public_html/' }}

      # 5. Backend -> the "Application root" of the cPanel Node.js app
      - name: Deploy Backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-ready/api/
          server-dir: ${{ secrets.FTP_API_DIR || './usta-api/' }}
