name: Deploy Static Frontend to cPanel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies (Monorepo Root)
        run: npm ci

      # --- 1. ADIM: NEXT.JS STATIC EXPORT BUILD ---
      - name: Build Next.js Frontend
        run: |
          cd apps/web
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      # --- 2. ADIM: DEPLOY HAZIRLIĞI ---
      # Static export sadece 'apps/web/out' klasörünü üretir.
      # Bu klasörün içeriğini doğrudan FTP'ye yükleyeceğiz.
      - name: Prepare Static Output
        run: |
          # İsteğe bağlı: Eğer public klasöründeki bazı dosyaları da
          # out/ içine kopyalamak isterseniz (örn: manifest.webmanifest
          # export modunda otomatik kopyalanmayabilir):
          cp -r apps/web/public/* apps/web/out/ 2>/dev/null || true

      # --- 3. ADIM: FRONTEND'İ CPANEL'E FTP İLE GÖNDERME ---
      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./apps/web/out/
          server-dir: ./root/deploy/web/
          # Not: FTP kullanırken 'server-dir' cPanel'deki doküman kökünü
          # işaret etmelidir. Eğer FTP kullanıcısı doğrudan /root/deploy/web/
          # dizinine erişemiyorsa, FTP kullanıcınızın ana dizinine yükleyip
          # cPanel'de symlink kullanmanız gerekebilir.